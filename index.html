<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王者荣耀英雄 - 点击复制</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "微软雅黑", "PingFang SC", sans-serif;
            background: #f5f7fa;
            padding: 24px 20px 40px;
            min-height: 100vh;
        }
        .page-header { text-align: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 600; color: #1a1a2e; }
        .page-header .sub { font-size: 14px; color: #888; margin-top: 6px; }
        .page-header .status {
            display: inline-block; margin-top: 10px; font-size: 14px;
            padding: 4px 16px; border-radius: 20px; transition: all 0.3s;
            background: #e8f0fe; color: #409eff;
        }
        .page-header .status.error { color: #f56c6c; background: #fef0f0; }
        .page-header .status.success { color: #67c23a; background: #f0f9eb; }

        .container {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }
        .hero-btn {
            background: #fff; color: #2c3e50; border: 1px solid #e4e7ed;
            padding: 14px 8px; border-radius: 10px; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            text-align: center; user-select: none;
        }
        .hero-btn:hover { background: #409eff; color: #fff; border-color: #409eff; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(64,158,255,0.30); }
        .hero-btn:active { transform: scale(0.96); }

        .toast {
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.78); color: #fff; padding: 10px 28px; border-radius: 8px;
            font-size: 15px; font-weight: 500; pointer-events: none; opacity: 0;
            transition: opacity 0.30s ease, transform 0.30s ease; z-index: 999; backdrop-filter: blur(4px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .skeleton { background: #eef1f5; border-radius: 10px; height: 52px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #909399; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .retry-btn { margin-top: 16px; padding: 8px 28px; background: #409eff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .empty-state .retry-btn:hover { background: #337ecc; }
        @media (max-width: 600px) { .container { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>🏆 王者荣耀 · 英雄</h1>
        <p class="sub">点击按钮复制英雄名称</p>
        <div class="status" id="statusBadge">⏳ 加载中...</div>
    </header>
    <div class="toast" id="toast">✅ 已复制</div>
    <div class="container" id="heroContainer"></div>

    <script>
        const container = document.getElementById('heroContainer');
        const toast = document.getElementById('toast');
        const statusBadge = document.getElementById('statusBadge');
        let toastTimer = null;

        function showToast(text) {
            toast.textContent = text || '✅ 已复制';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast(`✅ 已复制「${text}」`)).catch(() => fallbackCopy(text));
            } else { fallbackCopy(text); }
        }
        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            input.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
            document.body.appendChild(input);
            input.select();
            try { if (document.execCommand('copy')) showToast(`✅ 已复制「${text}」`); else showToast('⚠️ 复制失败'); } 
            catch (_) { showToast('⚠️ 复制失败'); }
            document.body.removeChild(input);
        }

        function renderHeroes(heroList) {
            container.innerHTML = '';
            if (!heroList || heroList.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="msg">暂无英雄数据</div></div>`;
                return;
            }
            const fragment = document.createDocumentFragment();
            heroList.forEach(hero => {
                const name = hero.cname || '未知英雄';
                const btn = document.createElement('button');
                btn.className = 'hero-btn';
                btn.textContent = name;
                btn.addEventListener('click', () => copyText(name));
                fragment.appendChild(btn);
            });
            container.appendChild(fragment);
        }

        function showSkeletons(count = 28) {
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < count; i++) { const div = document.createElement('div'); div.className = 'skeleton'; fragment.appendChild(div); }
            container.appendChild(fragment);
        }

        function setStatus(text, type) {
            statusBadge.textContent = text;
            statusBadge.className = 'status';
            if (type === 'error') statusBadge.classList.add('error');
            else if (type === 'success') statusBadge.classList.add('success');
        }

        // ============================================================
        //  核心改进：使用更稳定的代理，并内置“失败重试”机制
        // ============================================================
        function fetchHeroData() {
            showSkeletons(28);
            setStatus('⏳ 加载中...', '');

            // 代理列表（按稳定性排序，若第一个失败自动尝试第二个）
            const proxyList = [
                'https://api.codetabs.com/v1/proxy?quest=',
                'https://corsproxy.io/?url='
            ];
            const targetUrl = 'https://pvp.qq.com/web201605/js/herolist.json';

            let currentProxyIndex = 0;

            function tryFetch() {
                if (currentProxyIndex >= proxyList.length) {
                    // 所有代理均失败
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🌐</div>
                            <div class="msg">所有代理均连接失败，请检查网络或稍后重试</div>
                            <button class="retry-btn" onclick="fetchHeroData()">🔄 重新加载</button>
                        </div>`;
                    setStatus('❌ 加载失败，点击重试', 'error');
                    return;
                }

                const proxyUrl = proxyList[currentProxyIndex];
                const fullUrl = proxyUrl + encodeURIComponent(targetUrl);
                console.log(`[尝试 ${currentProxyIndex+1}] 使用代理: ${proxyUrl}`);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                fetch(fullUrl, { signal: controller.signal })
                    .then(res => {
                        clearTimeout(timeoutId);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            renderHeroes(data);
                            setStatus(`✅ 已加载 ${data.length} 位英雄 (代理${currentProxyIndex+1})`, 'success');
                            console.log('数据加载成功');
                        } else {
                            throw new Error('数据格式异常');
                        }
                    })
                    .catch(err => {
                        clearTimeout(timeoutId);
                        console.warn(`代理${currentProxyIndex+1} 请求失败:`, err.message);
                        // 尝试下一个代理
                        currentProxyIndex++;
                        tryFetch();
                    });
            }

            tryFetch();
        }

        // 暴露重试函数到全局
        window.fetchHeroData = fetchHeroData;

        // 页面启动
        fetchHeroData();
    </script>
</body>
</html>
