<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王者荣耀英雄 - 点击复制</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "微软雅黑", "PingFang SC", sans-serif;
            background: #f5f7fa;
            padding: 24px 20px 40px;
            min-height: 100vh;
        }

        /* ===== 头部 ===== */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: 1px;
        }
        .page-header .sub {
            font-size: 14px;
            color: #888;
            margin-top: 6px;
        }
        .page-header .status {
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
            color: #409eff;
            background: #e8f0fe;
            padding: 4px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .page-header .status.error {
            color: #f56c6c;
            background: #fef0f0;
        }
        .page-header .status.success {
            color: #67c23a;
            background: #f0f9eb;
        }

        /* ===== 网格容器 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        /* ===== 英雄按钮 ===== */
        .hero-btn {
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #e4e7ed;
            padding: 14px 8px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            position: relative;
            user-select: none;
            text-align: center;
            line-height: 1.4;
        }
        .hero-btn:hover {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(64, 158, 255, 0.30);
        }
        .hero-btn:active {
            transform: scale(0.96);
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.30s ease, transform 0.30s ease;
            z-index: 999;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 加载占位 ===== */
        .skeleton {
            background: #eef1f5;
            border-radius: 10px;
            height: 52px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== 空状态 / 错误 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #909399;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state .msg {
            font-size: 16px;
        }
        .empty-state .retry-btn {
            margin-top: 16px;
            padding: 8px 28px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .empty-state .retry-btn:hover {
            background: #337ecc;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .page-header h1 {
                font-size: 22px;
            }
            .container {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .hero-btn {
                font-size: 13px;
                padding: 12px 6px;
            }
        }
        @media (max-width: 400px) {
            .container {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 8px;
            }
            .hero-btn {
                font-size: 12px;
                padding: 10px 4px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 头部 ===== -->
    <header class="page-header">
        <h1>🏆 王者荣耀 · 英雄</h1>
        <p class="sub">点击按钮复制英雄名称</p>
        <div class="status" id="statusBadge">⏳ 加载中...</div>
    </header>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast">✅ 已复制</div>

    <!-- ===== 英雄网格 ===== -->
    <div class="container" id="heroContainer"></div>

    <script>
        // ============================================================
        //  1. DOM 引用
        // ============================================================
        const container = document.getElementById('heroContainer');
        const toast = document.getElementById('toast');
        const statusBadge = document.getElementById('statusBadge');

        // ============================================================
        //  2. Toast 控制
        // ============================================================
        let toastTimer = null;

        function showToast(text) {
            toast.textContent = text || '✅ 已复制';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        // ============================================================
        //  3. 复制功能 (使用 Clipboard API + 降级方案)
        // ============================================================
        function copyText(text) {
            // 优先使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast(`✅ 已复制「${text}」`))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        // 降级方案：使用 input 选中 + execCommand
        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            input.style.position = 'fixed';
            input.style.left = '-9999px';
            input.style.top = '-9999px';
            document.body.appendChild(input);
            input.select();
            try {
                const ok = document.execCommand('copy');
                if (ok) {
                    showToast(`✅ 已复制「${text}」`);
                } else {
                    showToast('⚠️ 复制失败，请手动复制');
                }
            } catch (_) {
                showToast('⚠️ 复制失败，请手动复制');
            }
            document.body.removeChild(input);
        }

        // ============================================================
        //  4. 渲染英雄按钮
        // ============================================================
        function renderHeroes(heroList) {
            // 清空容器
            container.innerHTML = '';

            if (!heroList || heroList.length === 0) {
                container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <div class="msg">暂无英雄数据</div>
                        </div>
                    `;
                return;
            }

            // 使用 DocumentFragment 批量添加，提升性能
            const fragment = document.createDocumentFragment();

            heroList.forEach(hero => {
                const name = hero.cname || '未知英雄';
                const btn = document.createElement('button');
                btn.className = 'hero-btn';
                btn.textContent = name;
                btn.addEventListener('click', () => copyText(name));
                fragment.appendChild(btn);
            });

            container.appendChild(fragment);
        }

        // ============================================================
        //  5. 显示加载占位
        // ============================================================
        function showSkeletons(count) {
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();
            const num = count || 24;
            for (let i = 0; i < num; i++) {
                const div = document.createElement('div');
                div.className = 'skeleton';
                fragment.appendChild(div);
            }
            container.appendChild(fragment);
        }

        // ============================================================
        //  6. 更新状态标签
        // ============================================================
        function setStatus(text, type) {
            statusBadge.textContent = text;
            statusBadge.className = 'status';
            if (type === 'error') statusBadge.classList.add('error');
            else if (type === 'success') statusBadge.classList.add('success');
        }

        // ============================================================
        //  7. 获取数据（通过 CORS 代理）
        // ============================================================
        function fetchHeroData() {
            // 显示骨架屏
            showSkeletons(28);
            setStatus('⏳ 加载中...', '');

            // 使用 AllOrigins 代理（免费、无需授权、支持 CORS）
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            const targetUrl = 'https://pvp.qq.com/web201605/js/herolist.json';
ConstfullUrl + (encodeURIComponentfullUrlproxyUrltargetUrl；常数fullUrl = proxyUrl + encodeURIComponent(targetUrl);

// 设置超时（15 秒）// 设置超时（15 秒）

ConsttimeoutId = setTimeout(() => controller.abort()，15000)；常数timeoutId = setTimeout(() => controller.abort(), 15000);

fetch(fullUrl，{fetch(fullUrl            , {

标题：{headers: {
'Accept'：'应用程序/约翰逊，'接受': '应用程序/json',
                    },
                })
. then (response => { then (response => {
clearTimeout(timeoutId)；clearTimeout(timeoutId);
if(！response.ok){if (!response.ok) {
掷回新错误('HTTP${response.status}')；抛出新的误差('HTTP${响应.状态}`);
                    }
返回 response.json()；return响应.json();
                })
. then (data => { then (data => {
                    // 检查数据是否有效// 检查数据是否有效
if(Array.isArray(data)&&data。长度 > 0){if (Array.isArray(data) && data.length > 0) {
renderHeroes(data)；renderHeroes(data);
setStatus('✅ 已加载${data.length}位英雄‘，'success')；setStatus('✅已加载${data.length}位英雄‘，'success');
}else{} 其他 {
掷回新错误('数据格式异常')；抛出新的误差('数据格式异常');
                    }
                })
.catch(错误 => {catch(error => {
clearTimeout(timeoutId)；clearTimeout(timeoutId);
console.error('获取英雄数量依据失败：'，error)；console.error('获取英雄数据失败:', error);

                    // 显示错误状态// 显示错误状态
container.innerHTML = 'container.innerHTML = <div class="空状态">
                        `;
                                <div class="icon">🌐</div>
                                <div class="msg">数据加载失败，请检查网络后重试</div>
<button class="retry-btn"onclick="fetchHeroData()">🔄 重新加载</button>
                            </div>
                        `;
setStatus('❌ 加载失败，点击重试'，'误差')；setStatus('❌ 加载失败，点击重试', 'error');
                });
        }

//============================================================// ============================================================
//  8. 启动//  8. 启动
//============================================================// ============================================================
// 页面加载完成后自动获取数据// 页面加载完成后自动获取数据
fetchHeroData()；fetchHeroData();

        // 暴露重试函数到全局（用于按钮点击）// 暴露重试函数到全局（用于按钮点击）
window.fetchHeroData = fetchHeroData；window.fetchHeroData = fetchHeroData;
    </脚本>
