<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages 目录浏览</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b23; --fg:#e8ecf2; --muted:#8b96a8;
  --accent:#58a6ff; --border:#232b38; --hover:#1c2431; --dir:#ffd479;
  --ok:#3fb950; --err:#ff7b72;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--fg); padding:20px;
  font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:16px;margin:0 0 14px;font-weight:600;letter-spacing:.5px}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:10px;
}
.crumbs{flex:1;min-width:180px;overflow:auto;white-space:nowrap}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--muted);margin:0 6px}
button{
  font:inherit;color:var(--fg);background:var(--hover);cursor:pointer;
  border:1px solid var(--border);border-radius:8px;padding:6px 12px;
}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=search],input[type=password]{
  font:inherit;color:var(--fg);background:var(--bg);outline:none;
  border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:200px;
}
input[type=search]:focus,input[type=password]:focus{border-color:var(--accent)}
.token-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:10px;
}
.token-bar[hidden]{display:none}
.token-bar input{flex:1;min-width:200px}
.status{font-size:12px;color:var(--muted);margin:0 4px 10px;word-break:break-all}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
ul.list{
  list-style:none;margin:0;padding:0;overflow:hidden;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
}
ul.list li{border-bottom:1px solid var(--border)}
ul.list li:last-child{border-bottom:0}
ul.list li>a{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  color:var(--fg);text-decoration:none;
}
ul.list li>a:hover{background:var(--hover)}
.icon{width:18px;flex:none;text-align:center}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.dir .name{color:var(--dir)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 6px}
.size{font-size:12px;color:var(--muted);flex:none}
li.empty{padding:28px;text-align:center;color:var(--muted)}
.tips{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.9}
.tips code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📁 GitHub Pages 目录浏览 <span>通过 GitHub Contents API 读取</span></h1>

  <div class="bar">
    <button id="upBtn" title="返回上一级">↑ 上级</button>
    <div class="crumbs" id="crumbs"></div>
    <input type="search" id="filter" placeholder="过滤文件名…">
    <button id="refreshBtn">刷新</button>
    <button id="tokenBtn" title="设置 GitHub Token（可选，提升 API 限额）">🔑</button>
  </div>

  <div class="token-bar" id="tokenBar" hidden>
    <input type="password" id="tokenInput" placeholder="ghp_xxx（可选，仅保存在本机浏览器）" autocomplete="off">
    <button id="tokenSave">保存并刷新</button>
    <button id="tokenClear">清除</button>
  </div>

  <div class="status" id="status">准备就绪</div>
  <ul class="list" id="list"></ul>

  <div class="tips">
    本页通过 <code>GitHub Contents API</code> 读取目录内容，无需服务端目录索引。
    未登录调用限 <code>60 次/小时</code>，点击 🔑 填入 Personal Access Token（只需 public_repo 或无权限的 fine-grained token）可提升到 <code>5000 次/小时</code>。
    注意：本页需通过标准的 <code>https://用户名.github.io/仓库名/</code> 地址访问才能自动识别仓库。
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- DOM ---------------- */
  var listEl     = document.getElementById('list');
  var statusEl   = document.getElementById('status');
  var crumbsEl   = document.getElementById('crumbs');
  var filterEl   = document.getElementById('filter');
  var upBtn      = document.getElementById('upBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var tokenBtn   = document.getElementById('tokenBtn');
  var tokenBar   = document.getElementById('tokenBar');
  var tokenInput = document.getElementById('tokenInput');
  var tokenSave  = document.getElementById('tokenSave');
  var tokenClear = document.getElementById('tokenClear');

  var TOKEN_KEY = 'gh_contents_token';

  /* ---------------- 状态 ---------------- */
  var info       = getRepoInfo();       // { owner, repo, basePath } 或 null
  var currentUrl = new URL('.', location.href); // 当前目录的页面 URL（以 / 结尾）
  var items      = [];
  var loading    = false;

  /* ---------------- 自动识别仓库 ---------------- */

  // 从当前页面地址推断 GitHub 仓库信息
  function getRepoInfo() {
    var host = location.hostname;
    if (!host.endsWith('.github.io')) return null; // 自定义域名无法自动识别

    var owner = host.split('.')[0];
    var segs  = location.pathname.split('/').filter(Boolean);

    // 用户/组织主页: https://user.github.io/
    if (segs.length === 0) {
      return { owner: owner, repo: owner + '.github.io', basePath: '/' };
    }

    // 项目主页: https://user.github.io/repo/...
    return { owner: owner, repo: segs[0], basePath: '/' + segs[0] + '/' };
  }

  /* ---------------- 工具函数 ---------------- */

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function decode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  // 页面 URL -> 仓库内的相对路径（如 'docs/api'，根目录为 ''）
  function urlToRepoPath(url) {
    var p    = decode(url.pathname);
    var base = info.basePath;
    if (!p.startsWith(base)) return '';
    return p.slice(base.length).replace(/^\/+|\/+$/g, '');
  }

  // 仓库内相对路径 -> Contents API URL
  function repoPathToApi(repoPath) {
    var p = repoPath.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    return 'https://api.github.com/repos/'
      + encodeURIComponent(info.owner) + '/'
      + encodeURIComponent(info.repo)
      + '/contents/' + p;
  }

  // 当前目录下的子项对应的页面 URL
  function entryUrl(it) {
    return new URL(
      encodeURIComponent(it.name) + (it.isDir ? '/' : ''),
      currentUrl.href
    );
  }

  function formatSize(n) {
    if (n == null) return '';
    if (n === 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(1)) + ' ' + units[i];
  }

  function fileIcon(name) {
    var i   = name.lastIndexOf('.');
    var ext = i > 0 ? name.slice(i + 1).toLowerCase() : '';
    var map = {
      js:'🟨', mjs:'🟨', cjs:'🟨', jsx:'🟨', ts:'🟦', tsx:'🟦',
      html:'🌐', htm:'🌐', css:'🎨', scss:'🎨', less:'🎨', sass:'🎨',
      json:'🧾', yml:'🧾', yaml:'🧾', xml:'🧾', toml:'🧾',
      md:'📝', markdown:'📝', txt:'📄', log:'📄', csv:'📊', xls:'📊', xlsx:'📊',
      png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️', ico:'🖼️', bmp:'🖼️',
      pdf:'📕', doc:'📘', docx:'📘', ppt:'📙', pptx:'📙',
      zip:'📦', gz:'📦', tar:'📦', rar:'📦', '7z':'📦',
      mp4:'🎬', mov:'🎬', avi:'🎬', mkv:'🎬',
      mp3:'🎵', wav:'🎵', flac:'🎵', ogg:'🎵',
      py:'🐍', go:'🐹', rs:'🦀', java:'☕', c:'⚙️', h:'⚙️', cpp:'⚙️',
      sh:'💻', bash:'💻', bat:'💻', ps1:'💻', exe:'💻', dll:'💻',
      db:'🗄️', sql:'🗄️', sqlite:'🗄️', lock:'🔒', env:'🔑', gitignore:'🙈'
    };
    return map[ext] || '📄';
  }

  /* ---------------- Token ---------------- */

  function getToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function setToken(v) {
    try {
      if (v) localStorage.setItem(TOKEN_KEY, v);
      else   localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* 隐私模式等场景忽略 */ }
  }

  function buildHeaders() {
    var h = { 'Accept': 'application/vnd.github+json' };
    var t = getToken();
    if (t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }

  /* ---------------- 核心：扫描目录 ---------------- */

  async function scan(url) {
    if (loading) return;
    loading    = true;
    currentUrl = url;
    items      = [];
    listEl.innerHTML = '';

    renderCrumbs(url);
    updateUpBtn();

    var repoPath = urlToRepoPath(url);
    setStatus('正在读取 /' + (repoPath || '') + ' …');

    try {
      var res = await fetch(repoPathToApi(repoPath), {
        headers: buildHeaders(),
        cache: 'no-store'
      });

      if (res.status === 404) {
        throw new Error('目录不存在，或该仓库/分支不可访问（404）。');
      }
      if (res.status === 401) {
        throw new Error('Token 无效或已过期（401），请点击 🔑 重新设置。');
      }
      if (res.status === 403) {
        var remain = res.headers.get('X-RateLimit-Remaining');
        if (remain === '0') {
          throw new Error('已触发 GitHub API 速率限制（未登录 60 次/小时）。请点击 🔑 填写 Token 后重试。');
        }
        throw new Error('访问被拒绝（403）。私有仓库需要 Token，或触发了速率限制。');
      }
      if (!res.ok) {
        throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      }

      var data = await res.json();
      if (!Array.isArray(data)) {
        throw new Error('该路径不是目录（可能是文件），无法展开。');
      }

      items = data.map(function (it) {
        return {
          name:  it.name,
          isDir: it.type === 'dir',
          size:  it.size
        };
      }).sort(function (a, b) {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;  // 目录优先
        return a.name.localeCompare(b.name, 'zh-CN', { numeric: true });
      });

      render();
      setStatus('共 ' + items.length + ' 项 · /' + (repoPath || ''), 'ok');

    } catch (err) {
      var msg = err && err.message ? err.message : String(err);
      setStatus('读取失败：' + msg, 'err');

      var li = document.createElement('li');
      li.className   = 'empty';
      li.textContent = '😕 ' + msg;
      listEl.appendChild(li);
    } finally {
      loading = false;
    }
  }

  /* ---------------- 渲染 ---------------- */

  function render() {
    var q = filterEl.value.trim().toLowerCase();
    var shown = q
      ? items.filter(function (it) { return it.name.toLowerCase().indexOf(q) !== -1; })
      : items;

    listEl.innerHTML = '';

    if (shown.length === 0) {
      var li = document.createElement('li');
      li.className   = 'empty';
      li.textContent = items.length ? '没有匹配「' + filterEl.value + '」的项' : '空目录';
      listEl.appendChild(li);
      return;
    }

    var frag = document.createDocumentFragment();

    shown.forEach(function (it) {
      var li = document.createElement('li');
      if (it.isDir) li.className = 'dir';

      var a    = document.createElement('a');
      a.href   = entryUrl(it).href;

      var icon = document.createElement('span');
      icon.className   = 'icon';
      icon.textContent = it.isDir ? '📁' : fileIcon(it.name);

      var name = document.createElement('span');
      name.className   = 'name';
      name.textContent = it.name;

      a.appendChild(icon);
      a.appendChild(name);

      if (it.isDir) {
        var tag = document.createElement('span');
        tag.className   = 'tag';
        tag.textContent = '目录';
        a.appendChild(tag);

        a.addEventListener('click', function (e) {
          e.preventDefault();
          scan(new URL(encodeURIComponent(it.name) + '/', currentUrl.href));
        });
      } else {
        var sz = document.createElement('span');
        sz.className   = 'size';
        sz.textContent = formatSize(it.size);
        a.appendChild(sz);

        a.target = '_blank';
        a.rel    = 'noopener';
      }

      li.appendChild(a);
      frag.appendChild(li);
    });

    listEl.appendChild(frag);
  }

  function renderCrumbs(url) {
    crumbsEl.innerHTML = '';

    // 仓库根
    addCrumb('仓库根', new URL(info.basePath, location.origin));

    var rel = urlToRepoPath(url);
    if (rel) {
      var acc = [];
      rel.split('/').forEach(function (seg) {
        acc.push(seg);
        var p = info.basePath + acc.map(encodeURIComponent).join('/') + '/';
        addCrumb(decode(seg), new URL(p, location.origin));
      });
    }

    function addCrumb(text, u) {
      if (crumbsEl.childNodes.length) {
        var sep = document.createElement('span');
        sep.className   = 'sep';
        sep.textContent = '/';
        crumbsEl.appendChild(sep);
      }
      var a    = document.createElement('a');
      a.href   = u.href;
      a.textContent = text;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        scan(new URL(u.href));
      });
      crumbsEl.appendChild(a);
    }
  }

  function updateUpBtn() {
    var atRoot = urlToRepoPath(currentUrl) === '';
    upBtn.disabled = atRoot;
  }

  /* ---------------- 事件 ---------------- */

  upBtn.addEventListener('click', function () {
    if (urlToRepoPath(currentUrl) === '') return;
    scan(new URL('../', currentUrl));
  });

  refreshBtn.addEventListener('click', function () {
    scan(currentUrl);
  });

  filterEl.addEventListener('input', render);

  tokenBtn.addEventListener('click', function () {
    tokenBar.hidden = !tokenBar.hidden;
    if (!tokenBar.hidden) {
      tokenInput.value = getToken();
      tokenInput.focus();
    }
  });

  tokenSave.addEventListener('click', function () {
    setToken(tokenInput.value.trim());
    tokenBar.hidden = true;
    scan(currentUrl);
  });

  tokenClear.addEventListener('click', function () {
    setToken('');
    tokenInput.value = '';
    tokenBar.hidden  = true;
    scan(currentUrl);
  });

  /* ---------------- 启动 ---------------- */

  if (!info) {
    setStatus('无法自动识别仓库：当前页面不是标准 github.io 地址。', 'err');
    listEl.innerHTML =
      '<li class="empty">😕 请使用 https://用户名.github.io/仓库名/ 形式访问本页；' +
      '若已绑定自定义域名，请手动修改脚本中 getRepoInfo() 的返回值。</li>';
  } else {
    scan(currentUrl);
  }

})();
</script>
</body>
</html>
